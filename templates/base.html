<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Red-Team Auditor{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 2rem 1rem;
        }
        .container { max-width: 860px; margin: 0 auto; }
        h1 { font-size: 2rem; margin-bottom: .5rem; color: #f8fafc; }
        .muted { color: #94a3b8; }
        label { display: block; font-weight: 600; margin-bottom: .5rem; color: #cbd5e1; }
        .hint { font-size: .85rem; color: #64748b; margin-top: .3rem; }
        .field { margin-bottom: 1.5rem; }
        textarea, select, input[type=text] {
            width: 100%; padding: .8rem; border: 1px solid #334155; border-radius: 8px;
            background: #1e293b; color: #e2e8f0; font-size: .95rem;
        }
        textarea { height: 200px; resize: vertical; font-family: Consolas, 'Fira Code', monospace; }
        textarea:focus, select:focus, input:focus { outline: none; border-color: #3b82f6; }
        .btn {
            display: inline-block; padding: .9rem 1.4rem; border: none; border-radius: 8px;
            background: #dc2626; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
            text-decoration: none;
        }
        .btn:hover { background: #b91c1c; }
        .btn.wide { width: 100%; }
        .btn.secondary { background: #1d4ed8; }
        .btn.secondary:hover { background: #1e40af; }
        .error { background: #7f1d1d; border: 1px solid #dc2626; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .badge { padding: .25rem .75rem; border-radius: 999px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
        .sev-Critical { background: #dc2626; color: #fff; }
        .sev-High     { background: #ea580c; color: #fff; }
        .sev-Medium   { background: #d97706; color: #1e293b; }
        .sev-Low      { background: #16a34a; color: #fff; }
        .sev-Unknown  { background: #475569; color: #fff; }
        #loading { display: none; text-align: center; margin-top: 1rem; color: #94a3b8; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
